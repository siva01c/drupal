version: '3.8'

services:
  drupal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{project_slug}}-drupal
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    environment:
      VIRTUAL_HOST: {{project_slug}}.localhost
      LETSENCRYPT_HOST: {{project_slug}}.localhost
      DRUPAL_DATABASE_HOST: mariadb
      DRUPAL_DATABASE_NAME: drupal
      DRUPAL_DATABASE_USER: drupal
      DRUPAL_DATABASE_PASSWORD: ${DB_PASSWORD:-drupal}
      DRUPAL_REDIS_HOST: redis
      DRUPAL_REDIS_PORT: 6379
    volumes:
      - ./web/sites/default:/var/www/html/web/sites/default
      - drupal_modules:/var/www/html/web/modules/contrib
      - drupal_themes:/var/www/html/web/themes/contrib
    networks:
      - internal
      - agentic-ops

  nginx:
    image: nginx:alpine
    container_name: {{project_slug}}-nginx
    restart: unless-stopped
    depends_on:
      - drupal
    environment:
      VIRTUAL_HOST: {{project_slug}}.localhost
      LETSENCRYPT_HOST: {{project_slug}}.localhost
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - drupal_files:/var/www/html/web/sites/default/files:ro
    networks:
      - internal
      - agentic-ops

  mariadb:
    image: mariadb:11
    container_name: {{project_slug}}-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: ${DB_PASSWORD:-drupal}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: {{project_slug}}-redis
    restart: unless-stopped
    networks:
      - internal

  mailhog:
    image: mailhog/mailhog
    container_name: {{project_slug}}-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - internal

volumes:
  drupal_modules:
  drupal_themes:
  drupal_files:
  mariadb_data:

networks:
  internal:
  agentic-ops:
    external: true
